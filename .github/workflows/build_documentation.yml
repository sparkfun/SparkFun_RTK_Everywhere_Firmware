name: Build Documentation

# Allows you to run this workflow manually from the Actions tab
# on:
#   workflow_dispatch:
#     branches: ["main"]

# Run workflow on every commit
on:
  push:
    branches:
      - main
  workflow_dispatch:


# Sets permissions of the GITHUB_TOKEN to allow files to be committed to gh-pages branch
permissions:
  contents: write


jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instal pgnquant for optimize plugin
        run: sudo apt-get install pngquant

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Python dependencies
        run: pip install mkdocs-include-markdown-plugin mkdocs-monorepo-plugin mkdocs-redirects mkdocs-git-revision-date-localized-plugin mkdocs-git-committers-plugin-2 Pillow 'mkdocs-material[imaging]'

      - name: Set up build cache
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install Insiders build
        env:
          MKDOCS_TOKEN: ${{ secrets.MKDOCS_SECRET }}
        run: pip install mkdocs-material
      - run: mkdocs gh-deploy --clean

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site


  deploy:
    name: Deploy to GitHub Pages
    needs: build


    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source


    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4